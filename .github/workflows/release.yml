name: Build & Release Installers (Windows & Linux)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Installers (.deb, .rpm, .sh, .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            rpm

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Unit Tests
        run: cargo test

      - name: Build Release Binary & Package Linux Installers
        run: |
          chmod +x packaging/linux/build-linux-installers.sh
          ./packaging/linux/build-linux-installers.sh

      - name: Upload Linux Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: granco-planner-linux-installers
          path: |
            release/*.deb
            release/*.rpm
            release/*-installer.sh
            release/*.tar.gz

  build-windows:
    name: Build Windows Installer (NSIS Setup .exe & Portable .exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Unit Tests
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build Windows Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Build Windows NSIS Setup Installer (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\granco-planner.exe" "release\Granco-Planner-1.0.0-portable-x64.exe"
          makensis packaging\windows\installer.nsi

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: granco-planner-windows-installers
          path: |
            release/Granco-Planner-Setup-*.exe
            release/Granco-Planner-*-portable-x64.exe

  publish-release:
    name: Publish Installers to GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Installer Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "Granco Planner v1.0.0 (Native Rust - Windows & Linux)"
          body: |
            ## Granco Planner v1.0.0 — 100% Native Rust Edition
            Reescritura completa de **Granco Planner** en Rust nativo (`eframe`/`egui` + `rusqlite`).

            ### Instaladores Incluidos
            - **Windows (x64)**:
              - `Granco-Planner-Setup-1.0.0-x64.exe` (Instalador NSIS con accesos directos en Escritorio y Menú Inicio)
              - `Granco-Planner-1.0.0-portable-x64.exe` (Ejecutable portátil sin dependencias)
            - **Linux (x86_64)**:
              - `granco-planner_1.0.0_amd64.deb` (Paquete instalador para Debian / Ubuntu / Linux Mint)
              - `granco-planner-1.0.0-1.x86_64.rpm` (Paquete instalador para Fedora / RHEL / openSUSE)
              - `granco-planner-1.0.0-linux-x86_64-installer.sh` (Instalador autoextraíble universal)
              - `granco-planner-1.0.0-linux-x86_64.tar.gz` (Archivo comprimido portátil)
          files: artifacts/*
          draft: false
          prerelease: false
